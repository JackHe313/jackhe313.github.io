  - slug: shorten_url
    title: High-Performance C++ Web Server
    subtitle: 1,000+ concurrent users · Mar–Jun 2025
    description: >-
      Built an asynchronous C++ web server using Boost.Asio, Redis caching, and PostgreSQL connection pooling
      to support 1,000+ concurrent users. Led a four-person team using TDD; automated CI/CD with Docker and
      Google Cloud Build.
    bullets:
