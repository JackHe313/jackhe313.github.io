  - slug: diffedit_project
    title: Text Guided Image Editing (DiffEdit)
    subtitle: Machine Learning
    description: >-
      Leveraged DiffEdit, an innovative text-conditioned diffusion model for semantic image editing,
      integrating it with BLIP and other models into an interactive framework for a seamless end-to-end image
      generation and editing pipeline. Additionally, pioneered a novel technique for text-guided mask
      generation in DiffEdit, enabling precise object segmentation through textual queries.
    status: Machine Learning
